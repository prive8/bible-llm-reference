name: CI

on:
  push:
    branches: [main]
    # Skip CI on docs-only changes to save the ~10-15 min CI budget
    # when only markdown / docs / notes are touched. PRs targeting
    # these paths still run the full test/eval gate (the paths-ignore
    # only applies on push to main, not on PR).
    #
    # Note: workflow file changes (.github/workflows/*.yml) are NOT
    # in the ignore list — they still trigger CI to validate the change.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'notes/**'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run sister-script test suite
        run: python tests/run_all.py

  eval-regression:
    # Runs the retrieval evaluation harness with a recall@10 threshold
    # gate. Only fires on push to main (not on PRs — PR contributors
    # don't ship a stable index, and the matrix would multiply the
    # index build by 8). If recall@10 drops below the baseline
    # minus a small tolerance, the job fails.
    #
    # Baseline (v0.9.0): semantic=0.279, hybrid=0.233.
    # Threshold: 0.25 (semantic), 0.20 (hybrid). Set deliberately below
    # the baseline so we catch regressions, not natural variance.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The index build dominates this job's wall time. The corpus grew
    # from 43,483 to 66,689 passages when multi-tradition support
    # landed (2026-10-08), and this runner has 2 vCPU, so a cold build
    # is ~36 min. 60 leaves headroom for a cold build plus the eval.
    # The cache below means the cold build only happens when the
    # corpus or the embedder changes.
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache sentence-transformers model
        # The 80 MB model download dominates the build time. Cache by
        # the model's content hash so subsequent runs reuse it.
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/sentence_transformers
          key: ${{ runner.os }}-sentence-transformers-all-MiniLM-L6-v2
          restore-keys: |
            ${{ runner.os }}-sentence-transformers-

      - name: Install sentence-transformers + numpy
        run: |
          python -m pip install --upgrade pip
          pip install "sentence-transformers>=2.2.0" "numpy>=1.20.0"

      - name: Compute corpus hash for the index cache key
        # The built index is a pure function of (corpus files, embedder
        # model, indexer code). Hashing all three means the cache is
        # reused across pushes that do not touch the corpus, and
        # rebuilt automatically when any of them changes.
        #
        # Each file is hashed by CONTENT, and the path is included so
        # a rename changes the hash too. The path must be printed with
        # its own printf - putting several paths in one echo would make
        # the shell see them as a single (nonexistent) filename.
        id: corpus
        run: |
          set -euo pipefail
          {
            find kjv.json translations data/quran data/tanakh data/torah -type f -name '*.json' 2>/dev/null | sort
            printf '%s\n' scripts/index_embeddings.py bible/semantic.py bible/lookup.py bible/quran.py bible/torah.py bible/tanakh.py
          } | while read -r f; do
            if [ -f "$f" ]; then
              printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$f"
            else
              printf 'MISSING  %s\n' "$f"
            fi
          done | sha256sum | cut -d' ' -f1 > /tmp/corpus_hash.txt
          echo "hash=$(cat /tmp/corpus_hash.txt)" >> "$GITHUB_OUTPUT"
          echo "corpus hash: $(cat /tmp/corpus_hash.txt)"

      - name: Restore the built semantic index
        # EXACT key match only - no restore-keys.
        #
        # A restore-keys prefix match would restore a STALE index (one
        # built from a different corpus) while reporting cache-hit=false,
        # so the build step would run and then fail: index_embeddings.py
        # refuses to overwrite an existing index without --overwrite.
        # That would turn every corpus change into a red CI run. An
        # exact match is the only case where the restored index is
        # guaranteed to match the current corpus.
        id: index-cache
        uses: actions/cache@v4
        with:
          path: |
            data/embeddings/default_meta.json
            data/embeddings/default_vectors.bin
          key: ${{ runner.os }}-semantic-index-${{ steps.corpus.outputs.hash }}-all-MiniLM-L6-v2

      - name: Build the local semantic index (skipped on cache hit)
        # ~36 min on a 2-vCPU runner for the full 66,689-passage corpus
        # (37,247 Christianity + 6,236 Islam + 23,206 Judaism). Only
        # runs when the corpus cache misses.
        #
        # --overwrite: the index is derived data that must match the
        # current corpus exactly. If anything is already on disk it is
        # stale, so replace it rather than failing.
        if: steps.index-cache.outputs.cache-hit != 'true'
        run: python scripts/index_embeddings.py --backend local --name default --batch-size 64 --overwrite

      - name: Verify the index matches the current corpus
        # The point of this step: run_eval.py SKIPS the semantic and
        # hybrid paths silently when the index is missing, and the
        # threshold gate would then pass on BM25 alone. So a missing or
        # stale index has to fail loudly here, before the eval runs.
        #
        # The expected passage count is computed from the corpus itself
        # (no embedder needed, ~0.4s) and compared against the index
        # metadata. A mismatch means the cached index was built from a
        # different corpus.
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from index_embeddings import collect_corpus

          meta_path = Path("data/embeddings/default_meta.json")
          bin_path = Path("data/embeddings/default_vectors.bin")

          if not meta_path.exists() or not bin_path.exists():
              print("::error::semantic index missing after build/cache step")
              sys.exit(1)

          meta = json.loads(meta_path.read_text())
          count = meta["count"]
          dim = meta["dim"]

          expected = len(collect_corpus())
          if count != expected:
              print(
                  f"::error::index is stale - it holds {count} passages "
                  f"but the current corpus has {expected}"
              )
              sys.exit(1)

          # The .bin must be exactly count * dim float32 values.
          expected_bytes = count * dim * 4
          actual_bytes = bin_path.stat().st_size
          if actual_bytes != expected_bytes:
              print(
                  f"::error::index .bin is truncated - {actual_bytes} bytes, "
                  f"expected {expected_bytes}"
              )
              sys.exit(1)

          print(f"index verified: {count} passages, {dim}-dim, {actual_bytes} bytes")
          PYEOF

      - name: Run sister-script test suite (CI also runs the 147-test gate here)
        run: python tests/run_all.py

      - name: Run retrieval evaluation with threshold gate
        # We use a small inline Python check rather than shell arithmetic
        # because shell float handling is finicky and we want clean
        # failure messages in the CI log.
        #
        # Thresholds reflect the v0.10.0 baseline (after the bm25_weight
        # default tuning sweep). Lower the threshold a bit so we catch
        # regressions, not natural variance.
        #
        # --tradition christianity: the v1 benchmark's 204 expected
        # citations are all Bible. Scoring it against the full
        # 3-tradition index lets 29,442 non-Bible passages compete for
        # the same top-10 slots and measures a scope mismatch rather
        # than retrieval quality. Scoped, the same index scores 0.282
        # semantic / 0.273 hybrid against a 0.279 / 0.258 baseline.
        # Switch to --benchmark v2 --split dev once the index cache
        # makes that affordable; benchmark v2 is the one with
        # cross-tradition queries.
        run: |
          python scripts/run_eval.py --paths bm25,semantic,hybrid --tradition christianity > /tmp/eval_report.txt
          python <<'PYEOF'
          import re
          import sys

          with open("/tmp/eval_report.txt") as f:
              report = f.read()

          # Thresholds: v0.10.0 baseline (hybrid tuned to bm25_weight=0.1
          # in v0.10.0 hybrid-fusion sweep; baseline 0.258). Lower the
          # threshold a bit so we catch regressions, not natural variance.
          THRESHOLDS = {
              "bm25":     {"recall_at_k": 0.06},   # baseline 0.093
              "semantic": {"recall_at_k": 0.25},   # baseline 0.279
              "hybrid":   {"recall_at_k": 0.22},   # baseline 0.258 (was 0.233 at v0.9.0 0.5 weight)
          }

          failed = []
          for path_name, thresholds in THRESHOLDS.items():
              # The harness emits lines like "| semantic | 0.279 | 0.165 | 0.151 | 0.222 |"
              # Find the row in the summary table.
              pattern = rf"\|\s*{path_name}\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|"
              m = re.search(pattern, report)
              if not m:
                  failed.append(f"{path_name}: no row found in eval report")
                  continue
              recall = float(m.group(1))
              threshold = thresholds["recall_at_k"]
              if recall < threshold:
                  failed.append(f"{path_name}: recall@10={recall:.3f} < threshold {threshold:.3f}")

          if failed:
              print("❌ RETRIEVAL REGRESSION DETECTED")
              for line in failed:
                  print(f"  {line}")
              sys.exit(1)
          print(f"✅ All retrieval thresholds met (semantic ≥ 0.25, hybrid ≥ 0.22, bm25 ≥ 0.06)")
          PYEOF

      - name: Upload eval report as CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: /tmp/eval_report.txt
          retention-days: 14
